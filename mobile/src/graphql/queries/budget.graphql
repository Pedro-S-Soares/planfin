query ActivePeriod($today: String!, $periodId: ID) {
  activePeriod(today: $today, periodId: $periodId) {
    id
    startDate
    endDate
    dailyLimit
    totalBudget
    remainingTotal
    status
    today {
      id
      date
      dailyLimit
      carryover
      availableBalance
      closedAt
    }
  }
}

query GroupPeriods {
  group {
    groupPeriods {
      id
      name
      startDate
      endDate
      dailyLimit
      totalBudget
      status
      availableBalance
    }
  }
}

query ExpenseHistory($periodId: ID!) {
  expenseHistory(periodId: $periodId) {
    date
    total
    expenses {
      id
      amount
      date
      note
      subcategory {
        id
        name
      }
      createdBy {
        id
        email
      }
    }
  }
}

query Categories($type: String) {
  categories(type: $type) {
    id
    name
    type
    subcategories {
      id
      name
    }
  }
}
