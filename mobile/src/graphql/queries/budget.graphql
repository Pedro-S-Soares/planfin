query ActivePeriod($today: String!, $periodId: ID) {
  activePeriod(today: $today, periodId: $periodId) {
    id
    startDate
    endDate
    dailyLimit
    totalBudget
    remainingTotal
    extraBudget
    extraSpent
    extraRemaining
    status
    today {
      id
      date
      dailyLimit
      carryover
      availableBalance
      spent
      closedAt
    }
  }
}

query GroupPeriods {
  groupPeriods {
    id
    name
    startDate
    endDate
    dailyLimit
    totalBudget
    status
    availableBalance
  }
}

query ExpenseHistory($periodId: ID!) {
  expenseHistory(periodId: $periodId) {
    date
    total
    expenses {
      id
      amount
      date
      note
      subcategory {
        id
        name
        category {
          id
          name
          icon
        }
      }
      createdBy {
        id
        email
      }
    }
  }
}

query Categories($type: String) {
  categories(type: $type) {
    id
    name
    type
    icon
    subcategories {
      id
      name
    }
  }
}
