query FinancialAccounts($today: String) {
  financialAccounts(today: $today) {
    id
    name
    kind
    isPrimary
    balance
    balanceDate
    closingDay
    dueDay
    owner {
      id
      name
      email
    }
  }
}

query Invoices($cardId: ID!, $today: String, $past: Int) {
  invoices(cardId: $cardId, today: $today, past: $past) {
    cardId
    month
    startDate
    closingDate
    dueDate
    total
    paid
    remaining
    status
  }
}

query Invoice($cardId: ID!, $month: String!, $today: String) {
  invoice(cardId: $cardId, month: $month, today: $today) {
    cardId
    month
    startDate
    closingDate
    dueDate
    total
    paid
    remaining
    status
    entries {
      id
      amount
      date
      note
      type
      isExtra
      countsInBudget
      installmentNumber
      installmentCount
      account {
        id
        name
        kind
      }
      subcategory {
        id
        name
        category {
          id
          name
          icon
        }
      }
      createdBy {
        id
        email
      }
    }
  }
}

query AccountMovements($accountId: ID!, $limit: Int) {
  accountMovements(accountId: $accountId, limit: $limit) {
    id
    kind
    date
    description
    amount
  }
}

query FinancePanel($today: String) {
  financePanel(today: $today) {
    hasAccounts
    primaryAccountId
    available
    committed
    free
    horizonDate
    commitments {
      kind
      label
      dueDate
      amount
      status
      cardId
      billId
      month
    }
  }
}

query RecurringBills {
  recurringBills {
    id
    name
    amount
    dueDay
    account {
      id
      name
      kind
    }
    subcategory {
      id
      name
      categoryId
    }
  }
}

query BillOccurrences($month: String!, $today: String) {
  billOccurrences(month: $month, today: $today) {
    month
    dueDate
    status
    amount
    expenseId
    bill {
      id
      name
      amount
      dueDay
      account {
        id
        name
        kind
      }
      subcategory {
        id
        name
        categoryId
      }
    }
  }
}
