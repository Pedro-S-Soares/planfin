query FinancialAccounts($today: String) {
  financialAccounts(today: $today) {
    id
    name
    kind
    isPrimary
    balance
    balanceDate
    closingDay
    dueDay
    invoiceGoal
    monthlyCredit
    creditDay
    nextCreditDate
    owner {
      id
      name
      email
    }
  }
}

query Invoices($cardId: ID!, $today: String, $past: Int) {
  invoices(cardId: $cardId, today: $today, past: $past) {
    cardId
    month
    startDate
    closingDate
    dueDate
    total
    paid
    remaining
    status
  }
}

query Invoice($cardId: ID!, $month: String!, $today: String) {
  invoice(cardId: $cardId, month: $month, today: $today) {
    cardId
    month
    startDate
    closingDate
    dueDate
    total
    paid
    remaining
    status
    entries {
      id
      amount
      date
      note
      type
      isExtra
      countsInBudget
      installmentNumber
      installmentCount
      source
      account {
        id
        name
        kind
      }
      subcategory {
        id
        name
        category {
          id
          name
          icon
        }
      }
      createdBy {
        id
        email
      }
    }
  }
}

query AccountMovements($accountId: ID!, $limit: Int) {
  accountMovements(accountId: $accountId, limit: $limit) {
    id
    kind
    date
    description
    amount
  }
}

query FinancePanel($today: String) {
  financePanel(today: $today) {
    hasAccounts
    primaryAccountId
    available
    committed
    free
    horizonDate
    commitments {
      kind
      label
      dueDate
      amount
      status
      cardId
      billId
      month
    }
    salary {
      configured
      amount
      cycleStartDate
      nextSalaryDate
      pending
    }
  }
}

query RecurringBills {
  recurringBills {
    id
    name
    amount
    dueDay
    direction
    onceMonth
    account {
      id
      name
      kind
    }
    subcategory {
      id
      name
      categoryId
    }
  }
}

query BillOccurrences($month: String!, $today: String) {
  billOccurrences(month: $month, today: $today) {
    month
    dueDate
    nextDueDate
    paidOn
    status
    amount
    expenseId
    bill {
      id
      name
      amount
      dueDay
      direction
      onceMonth
      account {
        id
        name
        kind
      }
      subcategory {
        id
        name
        categoryId
      }
    }
  }
}

query FinancialSettings($today: String) {
  financialSettings(today: $today) {
    salaryAmount
    salaryBusinessDay
    salaryAccountId
    reserveGoal
    upcomingSalaryDates {
      month
      date
      isManual
    }
  }
}

query AllowancePlan($today: String) {
  allowancePlan(today: $today) {
    cycleEndDate
    opensOn
    free
    shortfall
    amount
    canDistribute
    distributed
    shares {
      accountId
      accountName
      ownerName
      amount
    }
  }
}

query ReserveStatus($today: String) {
  reserveStatus(today: $today) {
    goal
    total
  }
}


query MonthPlan($today: String) {
  monthPlan(today: $today) {
    current {
      endDate
      hasPrimary
      balance
      salaries { label date amount }
      incomes { label date amount }
      invoices { label date amount }
      afterInvoices
      fixedBills { label date amount }
      oneOffBills { label date amount }
      leftover
    }
    next {
      startDate
      endDate
      days
      salary { label date amount }
      benefits { label date amount }
      fixedBills { label date amount }
      installments { label date amount }
      remaining
    }
  }
}
