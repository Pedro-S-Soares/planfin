mutation Login($email: String!, $password: String!) {
  login(email: $email, password: $password) {
    token
    user {
      id
      email
      isAdmin
    }
  }
}

mutation RegisterUser($email: String!, $password: String!, $passwordConfirmation: String!, $inviteToken: String!) {
  registerUser(email: $email, password: $password, passwordConfirmation: $passwordConfirmation, inviteToken: $inviteToken) {
    token
    user {
      id
      email
      isAdmin
    }
  }
}

mutation CreateInvite {
  createInvite {
    id
    token
    usedByEmail
    usedAt
    expiresAt
    revokedAt
    insertedAt
  }
}

mutation RevokeInvite($id: ID!) {
  revokeInvite(id: $id)
}

mutation Logout {
  logout
}

mutation ForgotPassword($email: String!) {
  forgotPassword(email: $email)
}

mutation ResetPassword($token: String!, $password: String!, $passwordConfirmation: String!) {
  resetPassword(token: $token, password: $password, passwordConfirmation: $passwordConfirmation)
}

mutation UpdateProfile($name: String) {
  updateProfile(name: $name) {
    id
    email
    name
  }
}
