mutation CreatePeriod($startDate: String!, $endDate: String!, $dailyLimit: String!, $totalBudget: String) {
  createPeriod(startDate: $startDate, endDate: $endDate, dailyLimit: $dailyLimit, totalBudget: $totalBudget) {
    id
    status
    dailyLimit
    totalBudget
    remainingTotal
  }
}

mutation UpdatePeriod($dailyLimit: String, $totalBudget: String) {
  updatePeriod(dailyLimit: $dailyLimit, totalBudget: $totalBudget) {
    id
    dailyLimit
    totalBudget
    remainingTotal
    status
  }
}

mutation CreateExpense($amount: String!, $date: String!, $note: String, $isExtra: Boolean, $subcategoryId: ID) {
  createExpense(amount: $amount, date: $date, note: $note, isExtra: $isExtra, subcategoryId: $subcategoryId) {
    id
    amount
    date
    note
    isExtra
    subcategory {
      id
      name
    }
    createdBy {
      id
      email
    }
  }
}

mutation UpdateExpense($id: ID!, $amount: String, $date: String, $note: String, $isExtra: Boolean, $subcategoryId: ID) {
  updateExpense(id: $id, amount: $amount, date: $date, note: $note, isExtra: $isExtra, subcategoryId: $subcategoryId) {
    id
    amount
    date
    note
    isExtra
    subcategory {
      id
      name
    }
  }
}

mutation DeleteExpense($id: ID!) {
  deleteExpense(id: $id)
}

mutation CreateCategory($name: String!) {
  createCategory(name: $name) {
    id
    name
    subcategories {
      id
      name
    }
  }
}

mutation UpdateCategory($id: ID!, $name: String!) {
  updateCategory(id: $id, name: $name) {
    id
    name
  }
}

mutation DeleteCategory($id: ID!) {
  deleteCategory(id: $id)
}

mutation CreateSubcategory($categoryId: ID!, $name: String!) {
  createSubcategory(categoryId: $categoryId, name: $name) {
    id
    name
  }
}

mutation DeleteSubcategory($id: ID!) {
  deleteSubcategory(id: $id)
}
