app = "planfin-api"
primary_region = "gru"

[build]

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PHX_SERVER = "true"
  PHX_HOST = "planfin-api.fly.dev"
  # Banco externo (Neon, sa-east-1): IPv4 + TLS obrigatorio.
  # ECTO_IPV6 removido de proposito — era exigido pela rede privada do Fly Postgres.
  DATABASE_SSL = "true"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Mantém 1 máquina sempre viva: ela nunca devolve a reserva de RAM do host,
  # então nunca precisa reconquistá-la num host lotado (incidente 2026-08-08).
  # Elimina também os ~3.4s de cold start pagos em toda sessão.
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
